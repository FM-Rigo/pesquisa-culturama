<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
        <section>
            <form action="" method="get">
                <fieldset>

                <legend>Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input id="name" type="text" name="userName" required>

                <label for="age">Idade:</label>
                <input id="age" type="number" name="age" min="12" max="100" required>

                <label for="date">Data de Nascimento:</label>
                <input id="date" type="date" name="birthDate">
                
                <br>
                <br>

                <label for="email">Email:</label>
                <input id="email" type="email" name="userEmail" required>

                <label for="phone">Telefone:</label>
                <input id="phone" type="tel" name="userPhone" placeholder="DDD + numeros sem espaço" maxlength="11" pattern="[0-9]{11}">

                <br>
                <br>

                <label for="userFile">Upload de Foto</label>
                <input id="userFile" type="file" name="userFile" accept="image/*">

                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>
                    <p>Genêro:</p>
                    <input id="genderF" type="radio" value="Feminino" name="userGender">
                    <label for="genderF">Feminino</label>
                    
                    <input id="genderM" type="radio" value="Masculino" name="userGender">
                    <label for="genderM">Masculino</label>
                    
                    <input id="notInfoed" type="radio" value="NotInformed" name="userGender">
                    <label for="notInfoed">Prefiro não informar</label>
                    <br>
                    <br>
                    <label for="mStatus">Estado Civil:</label>
                    <select id="mStatus" name="maritalStatus">
                        <option value="NotInformed">Selecione...</option>
                        <option value="Casado">Casado</option>
                        <option value="Solteiro">Solteiro</option>
                        <option value="Divorciado">Divorciado</option>
                        <option value="casado">União estável</option>
                    </select>
                    <br>
                    <br>

                    <label for="state">Estado:</label>
                    <select id="state" name="userEstate">
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AM">AM</option>
                        <option value="AP">AP</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MG">MG</option>
                        <option value="MS">MS</option>
                        <option value="MT">MT</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="PR">PR</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="RS">RS</option>
                        <option value="SC">SC</option>
                        <option value="SE">SE</option>
                        <option value="SP">SP</option>
                        <option value="TO">TO</option>
                    </select>


                    <label for="city">Cidade:</label>
                    <input id="city" type="text" name="userCity" autocomplete="address-level2" placeholder="Ex.: Fortaleza">
                    
                </fieldset> 

                <fieldset>

                    <legend>Hábitos</legend>

                    <p>Redes Sociais:</p>

                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>

                    <br>

                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>

                    <br>

                    <input id="twitter" type="checkbox" name="social" value="twitter">
                    <label for="twitter">X (Antigo Twitter)</label>

                    <br>

                    <input id="linkedin" type="checkbox" name="social" value="linkedin">
                    <label for="linkedin">LinkedIn</label>

                    <br>

                    <label for="musicStyle">Estilo musical:</label>
                    <input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">

                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Pop">
                        <option value="Hip-Hop">
                        <option value="Eletronica">
                        <option value="Sertanejo">
                        <option value="Complextro">
                        <option value="Dubstep">
                    </datalist>

                    <label for="favColor">Cor Favorita</label>
                    <input type="color" name="userFavColor" id="favColor" style="width: 25px; height: 25px;">
                    
                </fieldset> 

                <fieldset>

                    <legend>Satisfação</legend>

                    <p>Nível de satisfação:</p>

                    <input id="great" value="great" type="radio" name="userSatisfaction">
                    <label for="great">Ótima</label>

                    <input id="good" value="good" type="radio" name="userSatisfaction">
                    <label for="good">Boa</label>

                    <input id="regular" value="regular" type="radio" name="userSatisfaction">
                    <label for="regular">Regular</label>

                    <input id="horrible" value="horrible" type="radio" name="userSatisfaction">
                    <label for="horrible">Ruim</label>

                    <label for="comment" name="userOpinion"></label>

                    <br>

                    <p>Tem uma sugestâo ou opinião?</p>
                    <textarea name="userComment" id="comment" style="width: 250px; height: 75px;"  placeholder="Escreva seu comentário..."></textarea>
                </fieldset> 

                <button type="submit">Enviar</button> 
            </form>
        </section>
    </header>
</body>
</html>
